services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: transparency_ph_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transparency}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transparency_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-transparency_ph}
    ports:
      - '5432:5432'
    volumes:
      - transparency_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-transparency}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  transparency_pg_data:
